apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-cicd-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-cicd-app
  template:
    metadata:
      labels:
        app: cloud-cicd-app
    spec:
      containers:
        - name: cloud-cicd-app
          image: cloud-cicd-lab:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
